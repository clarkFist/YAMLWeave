<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200px" height="900px" viewBox="0 0 1200 900"
     style="background:#FFFFFF;">
<title>反向工程流程图</title>

<!-- 标题 -->
<text x="600" y="40" text-anchor="middle" font-family="SimHei" font-size="26" font-weight="bold" fill="#000000">
YAML配置反向工程流程图
</text>

<!-- 开始节点 -->
<circle cx="600" cy="80" r="15" fill="#000000"/>

<!-- 输入处理节点 -->
<rect x="480" y="120" width="240" height="60" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="600" y="145" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">输入处理目录和文件</text>
<text x="600" y="165" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">扫描目标代码项目结构</text>

<!-- 文件扫描节点 -->
<rect x="480" y="210" width="240" height="60" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
<text x="600" y="235" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">深度文件扫描</text>
<text x="600" y="255" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">递归遍历所有代码文件</text>

<!-- 代码分析判断 -->
<polygon points="570,320 630,300 670,320 630,340" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="630" y="325" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">代码分析</text>

<!-- 测试用例分析 -->
<rect x="50" y="400" width="180" height="70" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
<text x="140" y="425" text-anchor="middle" font-family="SimHei" font-size="20" font-weight="bold" fill="#000000">测试用例分析</text>
<text x="140" y="445" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">识别测试函数</text>
<text x="140" y="460" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">提取测试逻辑</text>

<!-- 函数结构分析 -->
<rect x="260" y="400" width="180" height="70" rx="10" fill="#E1F5FE" stroke="#03A9F4" stroke-width="2"/>
<text x="350" y="425" text-anchor="middle" font-family="SimHei" font-size="20" font-weight="bold" fill="#000000">函数结构分析</text>
<text x="350" y="445" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">解析函数定义</text>
<text x="350" y="460" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">分析调用关系</text>

<!-- 类与模块分析 -->
<rect x="470" y="400" width="180" height="70" rx="10" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
<text x="560" y="425" text-anchor="middle" font-family="SimHei" font-size="20" font-weight="bold" fill="#000000">类与模块分析</text>
<text x="560" y="445" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">类结构解析</text>
<text x="560" y="460" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">模块依赖关系</text>

<!-- 数据流分析 -->
<rect x="680" y="400" width="180" height="70" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="770" y="425" text-anchor="middle" font-family="SimHei" font-size="20" font-weight="bold" fill="#000000">数据流分析</text>
<text x="770" y="445" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">变量传递路径</text>
<text x="770" y="460" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">数据变换过程</text>

<!-- 配置生成器 -->
<rect x="400" y="520" width="280" height="80" rx="15" fill="#F0F4F8" stroke="#37474F" stroke-width="3"/>
<text x="540" y="545" text-anchor="middle" font-family="SimHei" font-size="22" font-weight="bold" fill="#000000">YAML配置生成器</text>
<text x="540" y="565" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">智能推断配置结构</text>
<text x="540" y="585" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">自动生成测试步骤</text>

<!-- 输出验证 -->
<polygon points="510,650 570,630 610,650 570,670" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="570" y="655" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">输出验证</text>

<!-- YAML文件输出 -->
<rect x="350" y="720" width="180" height="60" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="440" y="745" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">生成YAML文件</text>
<text x="440" y="765" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">结构化配置输出</text>

<!-- 报告生成 -->
<rect x="560" y="720" width="180" height="60" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="650" y="745" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">生成分析报告</text>
<text x="650" y="765" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">详细分析结果</text>

<!-- 验证测试 -->
<rect x="770" y="720" width="180" height="60" rx="10" fill="#E1F5FE" stroke="#2196F3" stroke-width="2"/>
<text x="860" y="745" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">验证测试</text>
<text x="860" y="765" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">配置有效性检查</text>

<!-- 结束节点 -->
<circle cx="600" cy="820" r="15" fill="#000000"/>
<circle cx="600" cy="820" r="8" fill="#FFFFFF"/>

<!-- 连接线 -->
<!-- 主流程线 -->
<line x1="600" y1="95" x2="600" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="600" y1="180" x2="600" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="600" y1="270" x2="630" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 分支连接线 -->
<line x1="610" y1="340" x2="140" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="620" y1="340" x2="350" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="630" y1="340" x2="560" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="640" y1="340" x2="770" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 汇聚到配置生成器 -->
<line x1="140" y1="470" x2="450" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="350" y1="470" x2="500" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="560" y1="470" x2="540" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="770" y1="470" x2="630" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 配置生成器到验证 -->
<line x1="540" y1="600" x2="570" y2="630" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 验证分支 -->
<line x1="550" y1="670" x2="440" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="570" y1="670" x2="650" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="590" y1="670" x2="860" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 到结束 -->
<line x1="440" y1="780" x2="580" y2="810" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="650" y1="780" x2="600" y2="810" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="860" y1="780" x2="620" y2="810" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 箭头标记 -->
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7"
 refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
</marker>
</defs>

</svg>