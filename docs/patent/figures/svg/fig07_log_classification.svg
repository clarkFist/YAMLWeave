<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200px" height="900px" viewBox="0 0 1200 900"
     style="background:#FFFFFF;">
<title>日志分类流程图</title>

<!-- 标题 -->
<text x="600" y="40" text-anchor="middle" font-family="SimHei" font-size="26" font-weight="bold" fill="#000000">
日志分类流程图
</text>

<!-- 开始节点 -->
<circle cx="600" cy="80" r="15" fill="#000000"/>

<!-- 接收日志 -->
<rect x="500" y="120" width="200" height="60" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
<text x="600" y="155" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">接收日志记录</text>

<!-- 解析日志 -->
<rect x="500" y="200" width="200" height="60" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
<text x="600" y="235" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">解析日志消息</text>

<!-- 日志级别判断 -->
<polygon points="570,300 630,280 670,300 630,320" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
<text x="630" y="305" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">级别判断</text>

<!-- DEBUG分支 -->
<rect x="50" y="360" width="120" height="50" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
<text x="110" y="380" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">DEBUG</text>
<text x="110" y="395" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">调试信息</text>

<!-- INFO分支 -->
<rect x="190" y="360" width="120" height="50" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="250" y="380" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">INFO</text>
<text x="250" y="395" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">一般信息</text>

<!-- WARNING分支 -->
<rect x="330" y="360" width="120" height="50" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="390" y="380" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">WARNING</text>
<text x="390" y="395" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">警告信息</text>

<!-- ERROR分支 -->
<rect x="470" y="360" width="120" height="50" rx="8" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
<text x="530" y="380" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">ERROR</text>
<text x="530" y="395" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">错误信息</text>

<!-- CRITICAL分支 -->
<rect x="610" y="360" width="120" height="50" rx="8" fill="#FFCDD2" stroke="#D32F2F" stroke-width="2"/>
<text x="670" y="380" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">CRITICAL</text>
<text x="670" y="395" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">严重错误</text>

<!-- 智能分类处理 -->
<rect x="250" y="470" width="280" height="80" rx="15" fill="#F0F4F8" stroke="#37474F" stroke-width="3"/>
<text x="390" y="495" text-anchor="middle" font-family="SimHei" font-size="22" font-weight="bold" fill="#000000">智能分类处理</text>
<text x="390" y="515" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">根据关键词分析消息内容</text>
<text x="390" y="535" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">自动识别消息类型和重要性</text>

<!-- 输出处理 -->
<rect x="450" y="600" width="180" height="60" rx="10" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
<text x="540" y="625" text-anchor="middle" font-family="SimHei" font-size="20" fill="#000000">格式化输出</text>
<text x="540" y="645" text-anchor="middle" font-family="SimHei" font-size="18" fill="#666">应用颜色编码</text>

<!-- 输出选择 -->
<polygon points="510,700 570,680 610,700 570,720" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
<text x="570" y="705" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">输出选择</text>

<!-- 控制台输出 -->
<rect x="350" y="770" width="150" height="50" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="425" y="790" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">控制台输出</text>
<text x="425" y="805" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">实时显示</text>

<!-- 文件输出 -->
<rect x="550" y="770" width="150" height="50" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="625" y="790" text-anchor="middle" font-family="SimHei" font-size="18" fill="#000000">文件输出</text>
<text x="625" y="805" text-anchor="middle" font-family="SimHei" font-size="16" fill="#666">持久化存储</text>

<!-- 结束节点 -->
<circle cx="570" cy="850" r="15" fill="#000000"/>
<circle cx="570" cy="850" r="8" fill="#FFFFFF"/>

<!-- 连接线 -->
<!-- 主流程线 -->
<line x1="600" y1="95" x2="600" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="600" y1="180" x2="600" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="600" y1="260" x2="630" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 分支连接线 -->
<line x1="610" y1="320" x2="110" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="620" y1="320" x2="250" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="630" y1="320" x2="390" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="640" y1="320" x2="530" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="650" y1="320" x2="670" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 汇聚到智能分类 -->
<line x1="110" y1="410" x2="300" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="250" y1="410" x2="340" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="390" y1="410" x2="390" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="530" y1="410" x2="440" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="670" y1="410" x2="480" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 智能分类到输出 -->
<line x1="440" y1="550" x2="540" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 输出选择 -->
<line x1="540" y1="660" x2="570" y2="680" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 输出分支 -->
<line x1="550" y1="720" x2="425" y2="770" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="590" y1="720" x2="625" y2="770" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 到结束 -->
<line x1="425" y1="820" x2="560" y2="840" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="625" y1="820" x2="580" y2="840" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- 箭头标记 -->
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7"
 refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
</marker>
</defs>

</svg>